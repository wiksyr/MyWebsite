<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Keep Blue</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="dark-page keep-blue-page">
<h1>Keep Blue :)</h1>
<h3>Włącz dźwięk, aby posłuchać</h3>
<div class="video-container keep-blue-video">
	<video src="assets/video/keep_blue_hymn.mp4" autoplay muted controls playsinline loop></video>
</div>
<hr class="divider">
<h1>Trzymaj się błękitu :)</h1>
<div class="gallery keep-blue-gallery">
	<div class="gallery-item">
		<img src="assets/images/1-2.jpeg" alt="Space and peace">
	</div>
	<div class="gallery-item">
		<img src="assets/images/2-2.jpeg" alt="Home of peace">
	</div>
	<div class="gallery-item">
		<img src="assets/images/3-2.jpeg" alt="Motto number 2">
	</div>
	<div class="gallery-item">
		<img src="assets/images/4-1.jpeg" alt="Motto number 6">
	</div>
	<div class="gallery-item">
		<img src="assets/images/motto-nr-2.jpeg" alt="Fiat in space">
	</div>
	<div class="gallery-item">
		<img src="assets/images/motto-nr-6.jpeg" alt="Mój Grom">
	</div>
</div>

<div id="keep-blue-lightbox" class="image-lightbox" role="dialog" aria-modal="true" aria-label="Enlarged image" hidden>
	<img id="keep-blue-lightbox-image" src="" alt="">
</div>

<script>
	const keepBlueLightbox = document.getElementById('keep-blue-lightbox');
	const keepBlueLightboxImage = document.getElementById('keep-blue-lightbox-image');
	const keepBlueGalleryImages = document.querySelectorAll('.keep-blue-gallery img');

	keepBlueGalleryImages.forEach(function (image) {
		image.addEventListener('click', function () {
			keepBlueLightboxImage.src = image.src;
			keepBlueLightboxImage.alt = image.alt;
			keepBlueLightbox.hidden = false;
		});
	});

	keepBlueLightbox.addEventListener('click', function (event) {
		if (event.target === keepBlueLightbox) {
			keepBlueLightbox.hidden = true;
			keepBlueLightboxImage.src = '';
		}
	});
</script>
</body>
</html>
