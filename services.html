<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Moja misja</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="dark-page services-page">
    <h2>Podążaj za moją pasją</h2>
    <h3>... i buduj swoje pozytywne doświadczenia!</h3>
<div class="slideshow">
    <figure class="slide active">
        <img src="assets/images/1-1.jpeg" alt="Slide 1">
    </figure>
    <figure class="slide">
        <img src="assets/images/2-1.jpeg" alt="Slide 2">
    </figure>
    <figure class="slide">
        <img src="assets/images/3-1.jpeg" alt="Slide 3">
    </figure>
</div>
<div class="gallery">
    <div class="gallery-item">
        <img src="assets/images/1-2.jpeg" alt="Zdjęcie 1">
        <div class="overlay"></div>
    </div>
    <div class="gallery-item">
        <img src="assets/images/2.jpeg" alt="Zdjęcie 2">
        <div class="overlay"></div>
    </div>
    <div class="gallery-item">
        <img src="assets/images/3.jpeg" alt="Zdjęcie 3">
        <div class="overlay"></div>
    </div>
    <div class="gallery-item">
        <img src="assets/images/4.jpeg" alt="Zdjęcie 4">
        <div class="overlay"></div>
    </div>
    <div class="gallery-item">
        <img src="assets/images/5.jpeg" alt="Zdjęcie 5">
        <div class="overlay"></div>
    </div>
    <div class="gallery-item">
        <img src="assets/images/6.jpeg" alt="Zdjęcie 6">
        <div class="overlay"></div>
    </div>
</div>
<script>
    const slides = document.querySelectorAll('.slideshow .slide');
    let currentSlide = 0;
    setInterval(() => {
        slides[currentSlide].classList.remove('active');
        currentSlide = (currentSlide + 1) % slides.length;
        slides[currentSlide].classList.add('active');
    }, 3000);
</script>
</body>
</html>
