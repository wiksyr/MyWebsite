<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Moja misja</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="dark-page services-page">
    <h2>Podążaj za moją pasją</h2>
    <h3>... i buduj swoje pozytywne doświadczenia!</h3>

<div class="gallery">
    <div class="gallery-item">
        <img src="assets/images/11.jpeg" alt="Zdjęcie 1">
        <div class="overlay">
            <p>Bóg Cię kocha!</p>
        </div>
    </div>
    <div class="gallery-item">
        <img src="assets/images/8.jpeg" alt="Zdjęcie 2">
        <div class="overlay">
            <p>Focus on your peace!</p>
        </div>
    </div>
    <div class="gallery-item">
        <img src="assets/images/12.jpeg" alt="Zdjęcie 3">
        <div class="overlay">
            <p>Enjoy the moment!</p>
        </div>
    </div>
    <div class="gallery-item">
        <img src="assets/images/4.jpeg" alt="Zdjęcie 4">
        <div class="overlay">
            <p>#EspressoPower</p>
        </div>
    </div>
    <div class="gallery-item">
        <img src="assets/images/2.jpeg" alt="Zdjęcie 5">
        <div class="overlay">
            <p>I kropka.</p>
        </div>
    </div>
    <div class="gallery-item">
        <img src="assets/images/5.jpeg" alt="Zdjęcie 6">
        <div class="overlay">
            <p>Keep Blue</p>
        </div>
    </div>
</div>

<div id="services-lightbox" class="image-lightbox" role="dialog" aria-modal="true" aria-label="Enlarged image" hidden>
    <img id="services-lightbox-image" src="" alt="">
</div>

<script>
    const servicesLightbox = document.getElementById('services-lightbox');
    const servicesLightboxImage = document.getElementById('services-lightbox-image');
    const servicesGalleryImages = document.querySelectorAll('.services-page .gallery-item img');

    servicesGalleryImages.forEach(function (image) {
        image.addEventListener('click', function () {
            servicesLightboxImage.src = image.src;
            servicesLightboxImage.alt = image.alt;
            servicesLightbox.hidden = false;
        });
    });

    servicesLightbox.addEventListener('click', function (event) {
        if (event.target === servicesLightbox) {
            servicesLightbox.hidden = true;
            servicesLightboxImage.src = '';
        }
    });
</script>
</body>
</html>
