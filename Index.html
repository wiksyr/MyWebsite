<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Błękitny-Grom007</title>
<link rel="icon" type="image/png" href="assets/logo/logo.png">
<link rel="stylesheet" href="styles.css">
</head>
<body class="shell-page">

<header id="header">
    <button id="hamburger" aria-label="Toggle menu" aria-expanded="false" aria-controls="menu">
        <span></span>
        <span></span>
        <span></span>
    </button>
    <a id="support-button" href="https://buycoffee.to/blekitnygrom007" target="_blank" rel="noopener noreferrer">Wspieram</a>
    <img id="logo" src="assets/logo/logo.png" alt="Logo">
</header>

<nav id="menu">
    <a data-page="home.html" class="active">Strona główna</a>
    <a data-page="about.html">Witaj</a>
    <a data-page="services.html">Podążaj za moją pasją</a>
    <a data-page="MaliPrzyjaciele.html">Mali Przyjaciele</a>
    <a data-page="WesoleMaluchy.html">Wesołe Maluchy</a>
    <a data-page="KeepBlue.html">Keep Blue</a>
    <a data-page="terminator.html">Terminator</a>
    <a data-page="angelOfPeace.html">Angel Of Peace</a>
    <a data-page="InSpace.html">In Space</a>
    <a data-page="contact.html">Kontakt</a>
</nav>

<div id="breadcrumb">Strona główna</div>

<iframe id="content" name="content" src="home.html" title="Page content"></iframe>

<script>
    const menu = document.getElementById('menu');
    const frame = document.getElementById('content');
    const hamburger = document.getElementById('hamburger');
    const breadcrumb = document.getElementById('breadcrumb');

    hamburger.addEventListener('click', function () {
        const isOpen = menu.classList.toggle('open');
        hamburger.classList.toggle('open', isOpen);
        hamburger.setAttribute('aria-expanded', isOpen);
    });

    menu.addEventListener('click', function (event) {
        const link = event.target.closest('a[data-page]');
        if (!link) return;

        event.preventDefault();

        frame.src = link.getAttribute('data-page');

        menu.querySelectorAll('a').forEach(a => a.classList.remove('active'));
        link.classList.add('active');

        breadcrumb.textContent = link.textContent;

        menu.classList.remove('open');
        hamburger.classList.remove('open');
        hamburger.setAttribute('aria-expanded', false);
    });
</script>

</body>
</html>
