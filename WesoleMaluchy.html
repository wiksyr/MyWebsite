<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wesołe Maluchy</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="dark-page wesole-maluchy-page">
<h1>Wesołe Maluchy</h1>
<div class="gallery">
    <div class="gallery-item">
        <img src="assets/images/bylo_nas_tylko_kilkoro.jpg" alt="bylo nas tylko kilkoro">
        <div class="overlay">
            <p>Było nas tylko kilkoro...</p>
        </div>
    </div>
    <div class="gallery-item">
        <img src="assets/images/choć_mali_to_sprawie_oddani.jpg" alt="chociaz mali to sprawie oddani">
        <div class="overlay">
            <p>Choć mali, to sprawie oddani.</p>
        </div>
    </div>
    <div class="gallery-item">
        <img src="assets/images/gdzie_kucharek_szesc.jpg" alt="gdzie kucharek szesc">
        <div class="overlay">
            <p>Gdzie kucharek sześć...</p>
        </div>
    </div>
    <div class="gallery-item">
        <img src="assets/images/nie_braklo_groma.jpg" alt="nie brakło groma">
        <div class="overlay">
            <p>Nie zabrakło i Groma!</p>
        </div>
    </div>
</div>

</html>
