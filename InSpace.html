<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>In Space</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="dark-page keep-blue-page">
<h1>In Space</h1>
<div class="video-container keep-blue-video">
	<video src="assets/video/Podazaj_do_blekitu.mp4" autoplay muted controls playsinline loop></video>
</div>
<hr class="divider">
<div class="gallery keep-blue-gallery">
	<div class="gallery-item">
		<img src="assets/images/space-peace.jpeg" alt="Space and peace">
	</div>
	<div class="gallery-item">
		<img src="assets/images/home-of-peace.jpeg" alt="Home of peace">
	</div>
	<div class="gallery-item">
		<img src="assets/images/motto-nr-2.jpeg" alt="Motto number 2">
	</div>
	<div class="gallery-item">
		<img src="assets/images/motto-nr-6.jpeg" alt="Motto number 6">
	</div>
	<div class="gallery-item">
		<img src="assets/images/fiat-in-space.jpeg" alt="Fiat in space">
	</div>
	<div class="gallery-item">
		<img src="assets/images/3.jpeg" alt="Mój Grom">
	</div>
</div>

<div id="in-space-lightbox" class="image-lightbox" role="dialog" aria-modal="true" aria-label="Enlarged image" hidden>
	<img id="in-space-lightbox-image" src="" alt="">
</div>

<script>
	const inSpaceLightbox = document.getElementById('in-space-lightbox');
	const inSpaceLightboxImage = document.getElementById('in-space-lightbox-image');
	const inSpaceGalleryImages = document.querySelectorAll('.keep-blue-gallery img');

	inSpaceGalleryImages.forEach(function (image) {
		image.addEventListener('click', function () {
			inSpaceLightboxImage.src = image.src;
			inSpaceLightboxImage.alt = image.alt;
			inSpaceLightbox.hidden = false;
		});
	});

	inSpaceLightbox.addEventListener('click', function (event) {
		if (event.target === inSpaceLightbox) {
			inSpaceLightbox.hidden = true;
			inSpaceLightboxImage.src = '';
		}
	});
</script>
</body>
</html>
